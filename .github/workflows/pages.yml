name: Kipo Privacy Pages (Google Play & App Store Compliance)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kipo-privacy-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-pages:
    name: "🌐 Publish Privacy Policy & Account Deletion to GitHub Pages"
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate Public Compliance HTML Pages
        run: |
          mkdir -p _site/privacidade _site/exclusao-de-conta _site/termos
          cp index.html _site/index.html
          cp privacidade/index.html _site/privacidade/index.html
          cp exclusao-de-conta/index.html _site/exclusao-de-conta/index.html
          cp termos/index.html _site/termos/index.html
          touch _site/.nojekyll
          test -s "_site/index.html" || { echo "::error::Missing _site/index.html"; exit 1; }
          test -s "_site/privacidade/index.html" || { echo "::error::Missing _site/privacidade/index.html"; exit 1; }
          test -s "_site/exclusao-de-conta/index.html" || { echo "::error::Missing _site/exclusao-de-conta/index.html"; exit 1; }
          test -s "_site/termos/index.html" || { echo "::error::Missing _site/termos/index.html"; exit 1; }

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
